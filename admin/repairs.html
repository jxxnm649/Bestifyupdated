<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Repairs — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='withdrawals.html'">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item" onclick="location.href='feedback.html'">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Repairs
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Repairs
          </h1>

          <p class="bf-admin-welcome-sub">
            Log and track device repair requests from start to finish.
          </p>

        </section>


        <!-- Summary -->
        <div
          id="repairsSummary"
          style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
        </div>


        <div style="margin-bottom:20px;">
          <button
            type="button"
            id="addRepairBtn"
            class="bf-btn bf-btn-primary">
            + New Repair Request
          </button>
        </div>


        <!-- Search + filter -->
        <div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">

          <input
            type="search"
            id="repairSearch"
            class="bf-input"
            placeholder="Search by customer, mobile, or device..."
            style="flex:1; min-width:220px; max-width:500px;">

          <select id="repairStatusFilter" class="bf-select" style="max-width:180px;">
            <option value="All Status">All Status</option>
            <option value="Received">Received</option>
            <option value="Diagnosing">Diagnosing</option>
            <option value="In Repair">In Repair</option>
            <option value="Ready for Pickup">Ready for Pickup</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>

        </div>


        <!-- Repair count -->
        <div
          id="repairCount"
          style="margin-bottom:15px;font-weight:600;">
          Loading repair requests...
        </div>


        <!-- Repairs list -->
        <div
          id="repairsList"
          style="display:flex; flex-direction:column; gap:12px;">

          <div class="bf-card" style="padding:20px;">
            Loading repair requests...
          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Add Repair Modal -->
  <div id="repairFormModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="repairFormCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title">New Repair Request</h2>

      <form id="repairForm">

        <div class="bf-field">
          <label class="bf-label">Customer Name</label>
          <input type="text" id="repairCustomerName" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Mobile Number</label>
          <input type="text" id="repairMobile" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Device (make & model)</label>
          <input type="text" id="repairDevice" class="bf-input" placeholder="e.g. iPhone 13" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Issue Description</label>
          <textarea id="repairIssue" class="bf-textarea" rows="3" placeholder="e.g. Cracked screen, battery drains fast" required></textarea>
        </div>

        <div class="bf-field">
          <label class="bf-label">Estimated Cost (₹)</label>
          <input type="number" id="repairEstimatedCost" class="bf-input" min="0" step="0.01">
        </div>

        <button
          type="submit"
          id="repairFormSubmitBtn"
          class="bf-btn bf-btn-primary bf-btn-block">
          Save Repair Request
        </button>

      </form>
    </div>
  </div>


  <!-- Repair Details Modal -->
  <div id="repairDetailsModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="repairDetailsCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title">Repair Details</h2>

      <div id="repairDetailsContent">
        Loading...
      </div>

    </div>
  </div>


  <script type="module" src="repairs.js"></script>

</body>
</html>
