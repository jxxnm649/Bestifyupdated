<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Commissions — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group open">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle bf-admin-nav-active"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem bf-admin-nav-subitem-active"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='withdrawals.html'">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item" onclick="location.href='feedback.html'">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Commissions
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Commissions
          </h1>

          <p class="bf-admin-welcome-sub">
            Track platform commission earned from each vendor's sales.
          </p>

        </section>


        <!-- Summary -->
        <div
          id="commissionsSummary"
          style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
        </div>


        <div style="margin-bottom:20px;">
          <button
            type="button"
            id="addCommissionBtn"
            class="bf-btn bf-btn-primary">
            + Add Commission Entry
          </button>
        </div>


        <!-- Search + filter -->
        <div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">

          <input
            type="search"
            id="commissionSearch"
            class="bf-input"
            placeholder="Search by vendor name..."
            style="flex:1; min-width:220px; max-width:500px;">

          <select id="commissionStatusFilter" class="bf-select" style="max-width:170px;">
            <option value="All">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Collected">Collected</option>
          </select>

        </div>


        <!-- Commission count -->
        <div
          id="commissionCount"
          style="margin-bottom:15px;font-weight:600;">
          Loading commissions...
        </div>


        <!-- Commissions -->
        <div
          id="commissionsList"
          style="display:flex; flex-direction:column; gap:12px;">

          <div class="bf-card" style="padding:20px;">
            Loading commissions...
          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Add Commission Modal -->
  <div id="commissionFormModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="commissionFormCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title">Add Commission Entry</h2>

      <form id="commissionForm">

        <div class="bf-field">
          <label class="bf-label">Vendor</label>
          <select id="commissionVendorSelect" class="bf-select" required>
            <option value="">Select a vendor...</option>
          </select>
        </div>

        <div class="bf-field">
          <label class="bf-label">Order Amount (₹)</label>
          <input type="number" id="commissionOrderAmount" class="bf-input" min="0" step="0.01" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Commission Rate (%)</label>
          <input type="number" id="commissionRateInput" class="bf-input" min="0" max="100" step="0.01" value="10" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Commission Amount (₹) — auto-calculated</label>
          <input type="number" id="commissionAmount" class="bf-input" min="0" step="0.01" value="0.00" readonly>
        </div>

        <div class="bf-field">
          <label class="bf-label">Note (optional)</label>
          <input type="text" id="commissionNote" class="bf-input" placeholder="e.g. Order #1234">
        </div>

        <button
          type="submit"
          id="commissionFormSubmitBtn"
          class="bf-btn bf-btn-primary bf-btn-block">
          Save Commission
        </button>

      </form>
    </div>
  </div>


  <script type="module" src="commissions.js"></script>

</body>
</html>
