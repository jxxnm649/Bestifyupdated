<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendors — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group open">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle bf-admin-nav-active"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem bf-admin-nav-subitem-active"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='withdrawals.html'">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item" onclick="location.href='feedback.html'">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Vendors
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Vendors
          </h1>

          <p class="bf-admin-welcome-sub">
            Onboard, edit, and manage seller accounts on Bestify.
          </p>

        </section>


        <div style="margin-bottom:20px;">
          <button
            type="button"
            id="addVendorBtn"
            class="bf-btn bf-btn-primary">
            + Add Vendor
          </button>
        </div>


        <!-- Search + filter -->
        <div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">

          <input
            type="search"
            id="vendorSearch"
            class="bf-input"
            placeholder="Search by shop name, owner, or mobile..."
            style="flex:1; min-width:220px; max-width:500px;">

          <select id="vendorStatusFilter" class="bf-select" style="max-width:170px;">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Blocked">Blocked</option>
          </select>

        </div>


        <!-- Vendor count -->
        <div
          id="vendorCount"
          style="margin-bottom:15px;font-weight:600;">
          Loading vendors...
        </div>


        <!-- Vendors -->
        <div
          id="vendorsList"
          style="
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
            gap:16px;
          ">

          <div class="bf-card" style="padding:20px;">
            Loading vendors...
          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Add / Edit Vendor Modal -->
  <div id="vendorFormModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="vendorFormCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title" id="vendorFormTitle">Add Vendor</h2>

      <form id="vendorForm">

        <div class="bf-field">
          <label class="bf-label">Shop / Business Name</label>
          <input type="text" id="shopName" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Owner Name</label>
          <input type="text" id="ownerName" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Email</label>
          <input type="email" id="vendorEmail" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Mobile</label>
          <input type="tel" id="vendorPhone" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Category</label>
          <input type="text" id="vendorCategory" class="bf-input" placeholder="e.g. Mobile Accessories">
        </div>

        <div class="bf-field">
          <label class="bf-label">Address</label>
          <textarea id="vendorAddress" class="bf-textarea"></textarea>
        </div>

        <div class="bf-field">
          <label class="bf-label">Commission Rate (%)</label>
          <input type="number" id="commissionRate" class="bf-input" min="0" max="100" value="10">
        </div>

        <div class="bf-field">
          <label class="bf-label">Status</label>
          <select id="vendorStatus" class="bf-select">
            <option value="Pending">Pending</option>
            <option value="Active">Active</option>
            <option value="Blocked">Blocked</option>
          </select>
        </div>

        <button
          type="submit"
          id="vendorFormSubmitBtn"
          class="bf-btn bf-btn-primary bf-btn-block">
          Save Vendor
        </button>

      </form>
    </div>
  </div>


  <!-- Vendor Detail (khatabook-style: products, earnings, wallet) -->
  <div id="vendorDetailModal" class="bf-modal-overlay">
    <div class="bf-modal" style="max-width:600px;">
      <button
        type="button"
        class="bf-modal-close"
        id="vendorDetailCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title" id="vendorDetailTitle">Vendor Details</h2>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;">
        <div class="bf-card" style="padding:12px;">
          <div style="font-size:11px;opacity:.65;">Products Added</div>
          <div id="vdProductCount" style="font-size:20px;font-weight:700;">—</div>
        </div>
        <div class="bf-card" style="padding:12px;">
          <div style="font-size:11px;opacity:.65;">Total Earnings</div>
          <div id="vdTotalEarnings" style="font-size:20px;font-weight:700;">—</div>
        </div>
        <div class="bf-card" style="padding:12px;">
          <div style="font-size:11px;opacity:.65;">Wallet Balance</div>
          <div id="vdWalletBalance" style="font-size:20px;font-weight:700;color:#2F7A4F;">—</div>
        </div>
      </div>

      <button type="button" id="vdAdjustWalletBtn" class="bf-btn bf-btn-primary bf-btn-block" style="margin-bottom:18px;">
        💰 Credit / Debit Wallet
      </button>

      <div class="bf-tabs" style="display:flex;gap:8px;margin-bottom:14px;">
        <button type="button" class="bf-btn bf-btn-ghost bf-btn-sm vd-tab active" data-tab="earnings" style="flex:1;">🧮 Earnings History</button>
        <button type="button" class="bf-btn bf-btn-ghost bf-btn-sm vd-tab" data-tab="wallet" style="flex:1;">👛 Wallet History</button>
        <button type="button" class="bf-btn bf-btn-ghost bf-btn-sm vd-tab" data-tab="products" style="flex:1;">📦 Products</button>
      </div>

      <div id="vdEarningsPanel" class="vd-panel">Loading...</div>
      <div id="vdWalletPanel" class="vd-panel" style="display:none;">Loading...</div>
      <div id="vdProductsPanel" class="vd-panel" style="display:none;">Loading...</div>

    </div>
  </div>


  <!-- Adjust Vendor Wallet Modal -->
  <div id="vendorWalletAdjustModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button type="button" class="bf-modal-close" id="vendorWalletAdjustCloseBtn" aria-label="Close">✕</button>

      <h2 class="bf-modal-title">Adjust Wallet</h2>
      <p style="margin-top:-10px;font-size:13px;opacity:.7;" id="vendorWalletAdjustVendorName"></p>
      <p style="font-size:13px;margin-bottom:14px;">Current Balance: <b id="vendorWalletAdjustCurrentBalance">₹0</b></p>

      <form id="vendorWalletAdjustForm">

        <div class="bf-field">
          <label class="bf-label">Type</label>
          <select id="vendorWalletAdjustType" class="bf-select">
            <option value="credit">Credit (Add money)</option>
            <option value="debit">Debit (Deduct money)</option>
          </select>
        </div>

        <div class="bf-field">
          <label class="bf-label">Amount (₹)</label>
          <input type="number" id="vendorWalletAdjustAmount" class="bf-input" min="1" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Reason</label>
          <input type="text" id="vendorWalletAdjustReason" class="bf-input" placeholder="e.g. Payout for October sales" required>
        </div>

        <button type="submit" id="vendorWalletAdjustSubmitBtn" class="bf-btn bf-btn-primary bf-btn-block">
          Save Adjustment
        </button>

      </form>
    </div>
  </div>


  <script type="module" src="vendors.js"></script>

</body>
</html>
