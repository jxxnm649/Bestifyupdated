<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wallets — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='withdrawals.html'">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item" onclick="location.href='feedback.html'">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Wallets
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Wallets
          </h1>

          <p class="bf-admin-welcome-sub">
            View customer wallet balances and credit or debit funds.
          </p>

        </section>


        <!-- Summary -->
        <div
          id="walletsSummary"
          style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
        </div>


        <!-- Tabs -->
        <div style="display:flex; gap:8px; margin-bottom:20px;">
          <button type="button" id="balancesTabBtn" class="bf-btn bf-btn-primary bf-btn-sm">Balances</button>
          <button type="button" id="transactionsTabBtn" class="bf-btn bf-btn-ghost bf-btn-sm">Transactions</button>
        </div>


        <!-- Balances panel -->
        <div id="balancesPanel">

          <div style="margin-bottom:20px;">
            <input
              type="search"
              id="walletSearch"
              class="bf-input"
              placeholder="Search by name, email, or mobile..."
              style="max-width:500px;">
          </div>

          <div
            id="walletsCount"
            style="margin-bottom:15px;font-weight:600;">
            Loading users...
          </div>

          <div
            id="walletsList"
            style="display:flex; flex-direction:column; gap:12px;">

            <div class="bf-card" style="padding:20px;">
              Loading users...
            </div>

          </div>

        </div>


        <!-- Transactions panel -->
        <div id="transactionsPanel" style="display:none;">

          <div
            id="transactionsCount"
            style="margin-bottom:15px;font-weight:600;">
            Loading transactions...
          </div>

          <div
            id="transactionsList"
            style="display:flex; flex-direction:column; gap:12px;">

            <div class="bf-card" style="padding:20px;">
              Loading transactions...
            </div>

          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Credit / Debit Modal -->
  <div id="walletAdjustModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="walletAdjustCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title" id="walletAdjustTitle">Adjust Wallet</h2>

      <form id="walletAdjustForm">

        <div class="bf-field">
          <label class="bf-label">Customer</label>
          <input type="text" id="walletAdjustCustomer" class="bf-input" disabled>
        </div>

        <div class="bf-field">
          <label class="bf-label">Current Balance</label>
          <input type="text" id="walletAdjustCurrentBalance" class="bf-input" disabled>
        </div>

        <div class="bf-field">
          <label class="bf-label">Action</label>
          <select id="walletAdjustType" class="bf-select">
            <option value="credit">Credit (add funds)</option>
            <option value="debit">Debit (remove funds)</option>
          </select>
        </div>

        <div class="bf-field">
          <label class="bf-label">Amount (₹)</label>
          <input type="number" id="walletAdjustAmount" class="bf-input" min="1" required>
        </div>

        <div class="bf-field">
          <label class="bf-label">Reason</label>
          <textarea id="walletAdjustReason" class="bf-textarea" required></textarea>
        </div>

        <button
          type="submit"
          id="walletAdjustSubmitBtn"
          class="bf-btn bf-btn-primary bf-btn-block">
          Confirm
        </button>

      </form>
    </div>
  </div>


  <script type="module" src="wallets.js"></script>

</body>
</html>
