<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chats — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='withdrawals.html'">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item" onclick="location.href='feedback.html'">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Chats
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Chats
          </h1>

          <p class="bf-admin-welcome-sub">
            Message customers directly and keep every conversation in one place.
          </p>

        </section>


        <div style="margin-bottom:20px;">
          <button
            type="button"
            id="startChatBtn"
            class="bf-btn bf-btn-primary">
            + Start New Chat
          </button>
        </div>


        <!-- Search -->
        <div style="margin-bottom:20px;">

          <input
            type="search"
            id="chatSearch"
            class="bf-input"
            placeholder="Search by customer name..."
            style="width:100%; max-width:500px;">

        </div>


        <!-- Chat count -->
        <div
          id="chatCount"
          style="margin-bottom:15px;font-weight:600;">
          Loading chats...
        </div>


        <!-- Chats list -->
        <div
          id="chatsList"
          style="display:flex; flex-direction:column; gap:12px;">

          <div class="bf-card" style="padding:20px;">
            Loading chats...
          </div>

        </div>

      </main>

    </div>

  </div>


  <!-- Start Chat Modal -->
  <div id="startChatModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="startChatCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title">Start New Chat</h2>

      <form id="startChatForm">

        <div class="bf-field">
          <label class="bf-label">Customer</label>
          <select id="startChatUserSelect" class="bf-select" required>
            <option value="">Select a user...</option>
          </select>
        </div>

        <button
          type="submit"
          id="startChatSubmitBtn"
          class="bf-btn bf-btn-primary bf-btn-block">
          Start Chat
        </button>

      </form>
    </div>
  </div>


  <!-- Chat Thread Modal -->
  <div id="chatThreadModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button
        type="button"
        class="bf-modal-close"
        id="chatThreadCloseBtn"
        aria-label="Close">
        ✕
      </button>

      <h2 class="bf-modal-title" id="chatThreadTitle">Conversation</h2>

      <div
        id="chatMessages"
        style="max-height:340px; overflow-y:auto; padding:8px 4px; margin-bottom:14px; border-top:1px solid var(--line, #E4DED2); border-bottom:1px solid var(--line, #E4DED2);">
        Loading messages...
      </div>

      <form id="chatReplyForm" style="display:flex; gap:8px;">

        <input
          type="text"
          id="chatReplyInput"
          class="bf-input"
          placeholder="Type a message..."
          autocomplete="off"
          spellcheck="true"
          style="flex:1; color:var(--ink,#14213D); background:var(--paper,#FBF7F0); caret-color:var(--ink,#14213D);">

        <button
          type="submit"
          id="chatReplySendBtn"
          class="bf-btn bf-btn-primary">
          Send
        </button>

      </form>

    </div>
  </div>


  <script type="module" src="chats.js"></script>

</body>
</html>
