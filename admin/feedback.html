<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feedback — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='withdrawals.html'">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Feedback
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            User Feedback
          </h1>

          <p class="bf-admin-welcome-sub">
            Feedback and suggestions submitted by users.
          </p>

        </section>

        <div style="margin-bottom:16px;">
          <select id="fbCategoryFilter" class="bf-select" style="max-width:200px;">
            <option value="All">All Categories</option>
            <option value="App Experience">App Experience</option>
            <option value="Product Quality">Product Quality</option>
            <option value="Delivery">Delivery</option>
            <option value="Support">Customer Support</option>
            <option value="Suggestion">Suggestion / Idea</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div id="fbCount" style="margin-bottom:15px;font-weight:600;">Loading feedback...</div>

        <div id="fbList" style="display:flex; flex-direction:column; gap:12px;">
          <div class="bf-card" style="padding:20px;">Loading feedback...</div>
        </div>

      </main>

    </div>

  </div>


  <script type="module" src="feedback.js"></script>

</body>
</html>
