<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Withdrawals — Bestify Admin</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <!-- Sidebar -->
    <aside class="bf-admin-sidebar">

      <div class="bf-admin-sidebar-brand">
        <img
          src="../bestify-logo.jpeg"
          alt="Bestify Mobile"
          class="bf-admin-logo-img">

        <span class="bf-admin-brand-text">
          Bestify
        </span>
      </div>

      <nav class="bf-admin-nav">

        <button
          class="bf-admin-nav-item"
          onclick="location.href='index.html'">
          📊
          <span>Dashboard</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='users.html'">
          👥
          <span>Users</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='products.html'">
          📦
          <span>Products</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='orders.html'">
          🧾
          <span>Orders</span>
        </button>

        <div class="bf-admin-nav-group">
          <button
            type="button"
            class="bf-admin-nav-item bf-admin-nav-group-toggle"
            onclick="this.closest('.bf-admin-nav-group').classList.toggle('open')">
            🏬
            <span>Vendor</span>
            <span class="bf-admin-nav-caret">▾</span>
          </button>
          <div class="bf-admin-nav-submenu">
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='vendors.html'">
              📋 <span>Applications &amp; Directory</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='pending-products.html'">
              🕓 <span>Pending Products</span>
            </button>
            <button
              type="button"
              class="bf-admin-nav-subitem"
              onclick="location.href='commissions.html'">
              🧮 <span>Commissions</span>
            </button>
          </div>
        </div>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='payments.html'">
          💳
          <span>Payments</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='wallets.html'">
          👛
          <span>Wallets</span>
        </button>

        <button
          class="bf-admin-nav-item bf-admin-nav-active">
          🏧
          <span>Withdrawals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='feedback.html'">
          💬
          <span>Feedback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='alerts.html'">
          🔴
          <span>Activity</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='cashback.html'">
          💸
          <span>Cashback</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='referrals.html'">
          🔗
          <span>Referrals</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='repairs.html'">
          🔧
          <span>Repairs</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='chats.html'">
          💬
          <span>Chats</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='notifications.html'">
          🔔
          <span>Notifications</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='reports.html'">
          📈
          <span>Reports</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='audit-log.html'">
          🗂️
          <span>Audit Log</span>
        </button>

        <button
          class="bf-admin-nav-item"
          onclick="location.href='settings.html'">
          ⚙️
          <span>Settings</span>
        </button>

      </nav>

    </aside>


    <!-- Main -->
    <div class="bf-admin-main-col">

      <!-- Header -->
      <header class="bf-admin-header">

        <div class="bf-admin-header-title">

          <span class="bf-admin-header-brand">
            Bestify Mobile
          </span>

          <span class="bf-admin-header-label">
            Withdrawals
          </span>

        </div>

      </header>


      <!-- Content -->
      <main class="bf-admin-content">

        <section class="bf-admin-welcome">

          <h1>
            Withdrawal Requests
          </h1>

          <p class="bf-admin-welcome-sub">
            Review and process user &amp; supplier payout requests (UPI / bank transfer).
          </p>

        </section>


        <div id="wdSummary" style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;"></div>


        <!-- Filters -->
        <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
          <select id="wdTypeFilter" class="bf-select" style="max-width:160px;">
            <option value="All">All Types</option>
            <option value="user">Users</option>
            <option value="vendor">Suppliers</option>
          </select>
          <select id="wdStatusFilter" class="bf-select" style="max-width:160px;">
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="All">All Status</option>
          </select>
          <input type="search" id="wdSearch" class="bf-input" placeholder="Search by name..." style="flex:1;min-width:200px;">
        </div>

        <div id="wdCount" style="margin-bottom:15px;font-weight:600;">Loading requests...</div>

        <div id="wdList" style="display:flex; flex-direction:column; gap:12px;">
          <div class="bf-card" style="padding:20px;">Loading requests...</div>
        </div>

      </main>

    </div>

  </div>


  <!-- Approve / Reject Modal -->
  <div id="wdProcessModal" class="bf-modal-overlay">
    <div class="bf-modal">
      <button type="button" class="bf-modal-close" id="wdProcessCloseBtn" aria-label="Close">✕</button>

      <h2 class="bf-modal-title" id="wdProcessTitle">Reject Request</h2>
      <p style="font-size:13px;opacity:.7;margin-top:-10px;" id="wdProcessSummary"></p>

      <form id="wdProcessForm">

        <div class="bf-field">
          <label class="bf-label">Note (optional)</label>
          <textarea id="wdProcessNote" class="bf-textarea" placeholder="e.g. Duplicate request / details incorrect"></textarea>
        </div>

        <button type="submit" id="wdProcessSubmitBtn" class="bf-btn bf-btn-primary bf-btn-block">
          Confirm
        </button>

      </form>
    </div>
  </div>


  <script type="module" src="withdrawals.js"></script>

</body>
</html>
