<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Brand</title>
<style>
  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
    margin: 0; 
    padding: 0; 
    background-color: #f4f6f8; 
    display: flex; 
    justify-content: center;
  }
  .app-container { 
    width: 100%; 
    max-width: 414px; 
    background: #ffffff; 
    min-height: 100vh; 
    position: relative; 
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
    padding-bottom: 90px;
  }
  
  /* Header & Progress Bar */
  .header { display: flex; align-items: center; padding: 20px; }
  .header h2 { margin: 0; font-size: 18px; margin-left: 20px; font-weight: 600; }
  .back-btn { font-size: 20px; cursor: pointer; }
  .progress-bar { display: flex; justify-content: space-between; padding: 10px 20px 20px 20px; font-size: 12px; color: #888; }
  .step { display: flex; flex-direction: column; align-items: center; }
  .step .circle { width: 24px; height: 24px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; font-weight: bold; }
  .step.active .circle { background: white; border: 2px solid #006b44; color: #006b44; }
  .step.active { color: #006b44; font-weight: bold; }
  
  /* Title Section */
  .title-section { padding: 10px 20px; }
  .title-section h1 { margin: 0; font-size: 22px; color: #111; font-weight: 700; }
  .title-section p { margin: 8px 0 20px 0; color: #666; font-size: 14px; }
  
  /* Brands Grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 0 20px; margin-bottom: 100px; }
  .brand-card { border: 1.5px solid #eee; border-radius: 12px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.2s; }
  .brand-card:hover, .brand-card.selected { border-color: #006b44; background: #f2fcf7; }
  
  .brand-logo { width: 45px; height: 45px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 0 auto 10px auto; }
  .logo-samsung { background: #1428a0; }
  .logo-apple { background: #333333; }
  .logo-xiaomi { background: #ff6900; }
  .logo-vivo { background: #415fff; }
  .logo-oppo { background: #008a65; }
  .logo-realme { background: #ffc107; color: #333;}
  
  .brand-card h3 { margin: 0; font-size: 13px; color: #222; font-weight: 600; }
  
  /* Bottom Nav */
  .bottom-bar { position: fixed; bottom: 0; width: 100%; max-width: 414px; background: #fff; padding: 20px; box-sizing: border-box; border-top: 1px solid #f0f0f0; }
  .btn-next { background: #006b44; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; }
</style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <a href="home.html" class="back-btn" style="text-decoration:none;color:inherit;">&#8592;</a>
    <h2>Find Your Product</h2>
  </div>

  <div class="progress-bar">
    <div class="step active"><div class="circle">1</div>Brand</div>
    <div class="step"><div class="circle">2</div>Series</div>
    <div class="step"><div class="circle">3</div>Model</div>
    <div class="step"><div class="circle">4</div>Category</div>
    <div class="step"><div class="circle">5</div>Type</div>
  </div>

  <div class="title-section">
    <h1>Which brand is your phone?</h1>
    <p>This helps us match the right size/fit.</p>
  </div>

  <div class="grid" id="brandGrid">
    <!-- Samsung -->
    <div class="brand-card" data-brand="Samsung">
      <div class="brand-logo logo-samsung">S</div>
      <h3>Samsung</h3>
    </div>
    <!-- Apple -->
    <div class="brand-card" data-brand="Apple">
      <div class="brand-logo logo-apple">A</div>
      <h3>Apple</h3>
    </div>
    <!-- Xiaomi -->
    <div class="brand-card" data-brand="Xiaomi">
      <div class="brand-logo logo-xiaomi">X</div>
      <h3>Xiaomi</h3>
    </div>
    <!-- Vivo -->
    <div class="brand-card" data-brand="Vivo">
      <div class="brand-logo logo-vivo">V</div>
      <h3>Vivo</h3>
    </div>
    <!-- Oppo -->
    <div class="brand-card" data-brand="Oppo">
      <div class="brand-logo logo-oppo">O</div>
      <h3>Oppo</h3>
    </div>
    <!-- Realme -->
    <div class="brand-card" data-brand="Realme">
      <div class="brand-logo logo-realme">R</div>
      <h3>Realme</h3>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-next" id="nextBtn">Next &rarr;</button>
  </div>

</div>

<script>
  const grid = document.getElementById("brandGrid");
  const nextBtn = document.getElementById("nextBtn");
  let selectedBrand = sessionStorage.getItem("cover_brand") || null;

  function applySelection() {
    document.querySelectorAll(".brand-card").forEach(card => {
      card.classList.toggle("selected", card.dataset.brand === selectedBrand);
    });
  }
  applySelection();

  grid.addEventListener("click", (e) => {
    const card = e.target.closest(".brand-card");
    if (!card) return;
    selectedBrand = card.dataset.brand;
    applySelection();
  });

  nextBtn.addEventListener("click", () => {
    if (!selectedBrand) {
      alert("Please select your phone's brand");
      return;
    }
    sessionStorage.setItem("cover_brand", selectedBrand);
    // Changing the brand invalidates any series/model/type/product
    // chosen for a previous brand.
    sessionStorage.removeItem("cover_series");
    sessionStorage.removeItem("cover_model");
    sessionStorage.removeItem("cover_type");
    sessionStorage.removeItem("cover_product_id");
    window.location.href = "coverseries.html";
  });
</script>

</body>
</html>
