<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="static-page.css">
  <style>
    .ns-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .ns-row:last-child{ border-bottom: none; }
    .ns-row-title{ font-weight: 600; font-size: 14px; }
    .ns-row-sub{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
    .ns-switch{ position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .ns-switch input{ opacity: 0; width: 0; height: 0; }
    .ns-slider{
      position: absolute; inset: 0; background: var(--line);
      border-radius: 999px; cursor: pointer; transition: .2s;
    }
    .ns-slider::before{
      content: ""; position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    .ns-switch input:checked + .ns-slider{ background: var(--marigold-deep); }
    .ns-switch input:checked + .ns-slider::before{ transform: translateX(20px); }
  </style>
</head>
<body class="bf-has-nav">

  <div class="container sp-container">

    <a href="profile.html" class="sp-back">← Back to Account</a>
    <h1>Notifications 🔔</h1>

    <div class="bf-card" style="padding:16px 18px;">

      <div class="ns-row">
        <div>
          <div class="ns-row-title">Order Updates</div>
          <div class="ns-row-sub">Shipping, delivery, and order status alerts</div>
        </div>
        <label class="ns-switch">
          <input type="checkbox" id="prefOrderUpdates" checked>
          <span class="ns-slider"></span>
        </label>
      </div>

      <div class="ns-row">
        <div>
          <div class="ns-row-title">Offers & Promotions</div>
          <div class="ns-row-sub">Deals, discounts, and new arrivals</div>
        </div>
        <label class="ns-switch">
          <input type="checkbox" id="prefPromotions" checked>
          <span class="ns-slider"></span>
        </label>
      </div>

      <div class="ns-row">
        <div>
          <div class="ns-row-title">Chat Replies</div>
          <div class="ns-row-sub">When our support team replies to you</div>
        </div>
        <label class="ns-switch">
          <input type="checkbox" id="prefChat" checked>
          <span class="ns-slider"></span>
        </label>
      </div>

    </div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html"><span>🏠</span><p>Home</p></a>
    <a href="wishlist.html"><span>😊</span><p>Liked</p></a>
    <a href="orders.html"><span>📦</span><p>Orders</p></a>
    <a href="profile.html"><span>🏪</span><p>My Account</p></a>
  </nav>

  <script type="module" src="notification-settings.js"></script>
  <script type="module" src="profile-menu.js"></script>

</body>
</html>
