<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings — Supplier Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../admin/admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <aside class="bf-admin-sidebar">
      <div class="bf-admin-sidebar-brand">
        <img src="../bestify-logo.jpeg" alt="Bestify" class="bf-admin-logo-img">
        <span class="bf-admin-brand-text">Supplier Portal</span>
      </div>

      <nav class="bf-admin-nav">
        <button class="bf-admin-nav-item" onclick="location.href='dashboard.html'">📊<span>Dashboard</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='products.html'">📦<span>My Products</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='orders.html'">🧾<span>My Orders</span></button>
        <button class="bf-admin-nav-item bf-admin-nav-active" onclick="location.href='earnings.html'">🧮<span>Earnings</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='withdraw.html'">💸<span>Withdraw</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='profile.html'">🏪<span>Shop Profile</span></button>
      </nav>
    </aside>

    <div class="bf-admin-main-col">

      <header class="bf-admin-header">
        <div class="bf-admin-header-title">
          <span class="bf-admin-header-brand">Bestify</span>
          <span class="bf-admin-header-label">Earnings</span>
        </div>
        <button type="button" id="logoutBtn" class="bf-btn bf-btn-ghost bf-btn-sm">🚪 Logout</button>
      </header>

      <main class="bf-admin-content">

        <section class="bf-admin-welcome">
          <h1>My Earnings 🧮</h1>
          <p class="bf-admin-welcome-sub">Commission ledger — like Khatabook, filter by status or date.</p>
        </section>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:20px;">
          <div class="bf-card" style="padding:16px;">
            <div style="font-size:12px;opacity:.65;">Wallet Balance</div>
            <div id="statWallet" style="font-size:22px;font-weight:700;margin-top:4px;color:#2F7A4F;">₹0</div>
          </div>
          <div class="bf-card" style="padding:16px;">
            <div style="font-size:12px;opacity:.65;">Total Earned</div>
            <div id="statTotal" style="font-size:22px;font-weight:700;margin-top:4px;">₹0</div>
          </div>
          <div class="bf-card" style="padding:16px;">
            <div style="font-size:12px;opacity:.65;">Collected</div>
            <div id="statCollected" style="font-size:22px;font-weight:700;margin-top:4px;color:#2F7A4F;">₹0</div>
          </div>
          <div class="bf-card" style="padding:16px;">
            <div style="font-size:12px;opacity:.65;">Pending</div>
            <div id="statPending" style="font-size:22px;font-weight:700;margin-top:4px;color:#D98925;">₹0</div>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <button type="button" class="bf-btn bf-btn-ghost bf-btn-sm ve-tab active" data-tab="earnings" style="flex:1;">🧮 Commission Ledger</button>
          <button type="button" class="bf-btn bf-btn-ghost bf-btn-sm ve-tab" data-tab="wallet" style="flex:1;">👛 Wallet History</button>
        </div>

        <div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;" id="earningsFilters">
          <select id="statusFilter" class="bf-select" style="max-width:170px;">
            <option value="All">All</option>
            <option value="Pending">Pending</option>
            <option value="Collected">Collected</option>
          </select>
          <input type="date" id="fromDate" class="bf-input" style="max-width:160px;">
          <input type="date" id="toDate" class="bf-input" style="max-width:160px;">
        </div>

        <div id="earningsList" style="display:flex;flex-direction:column;gap:10px;">
          <div class="bf-card" style="padding:20px;">Loading...</div>
        </div>

        <div id="walletList" style="display:none;flex-direction:column;gap:10px;">
        </div>

      </main>

    </div>

  </div>

  <script type="module" src="earnings.js"></script>

</body>
</html>
