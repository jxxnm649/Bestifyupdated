<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Profile — Supplier Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../admin/admin.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <aside class="bf-admin-sidebar">
      <div class="bf-admin-sidebar-brand">
        <img src="../bestify-logo.jpeg" alt="Bestify" class="bf-admin-logo-img">
        <span class="bf-admin-brand-text">Supplier Portal</span>
      </div>

      <nav class="bf-admin-nav">
        <button class="bf-admin-nav-item" onclick="location.href='dashboard.html'">📊<span>Dashboard</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='products.html'">📦<span>My Products</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='orders.html'">🧾<span>My Orders</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='earnings.html'">🧮<span>Earnings</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='withdraw.html'">💸<span>Withdraw</span></button>
        <button class="bf-admin-nav-item bf-admin-nav-active" onclick="location.href='profile.html'">🏪<span>Shop Profile</span></button>
      </nav>
    </aside>

    <div class="bf-admin-main-col">

      <header class="bf-admin-header">
        <div class="bf-admin-header-title">
          <span class="bf-admin-header-brand">Bestify</span>
          <span class="bf-admin-header-label">Shop Profile</span>
        </div>
        <button type="button" id="logoutBtn" class="bf-btn bf-btn-ghost bf-btn-sm">🚪 Logout</button>
      </header>

      <main class="bf-admin-content">

        <section class="bf-admin-welcome">
          <h1>Shop Profile</h1>
          <p class="bf-admin-welcome-sub">
            Commission Rate: <b id="commissionRateLabel">—</b> · Status:
            <span id="statusLabel" class="bf-status-pill bf-status-success">Active</span>
          </p>
        </section>

        <div class="bf-card" style="padding:20px;max-width:520px;">

          <form id="profileForm">

            <div class="bf-field">
              <label class="bf-label">Shop Name</label>
              <input type="text" id="shopName" class="bf-input" required>
            </div>

            <div class="bf-field">
              <label class="bf-label">Owner Name</label>
              <input type="text" id="ownerName" class="bf-input" required>
            </div>

            <div class="bf-field">
              <label class="bf-label">Phone Number</label>
              <input type="tel" id="vendorPhone" class="bf-input" required>
            </div>

            <div class="bf-field">
              <label class="bf-label">Email</label>
              <input type="email" id="vendorEmail" class="bf-input" required>
            </div>

            <div class="bf-field">
              <label class="bf-label">Category</label>
              <input type="text" id="vendorCategory" class="bf-input" required>
            </div>

            <div class="bf-field">
              <label class="bf-label">Shop Address</label>
              <textarea id="vendorAddress" class="bf-textarea" required></textarea>
            </div>

            <button type="submit" id="saveProfileBtn" class="bf-btn bf-btn-primary bf-btn-block">
              Save Changes
            </button>

          </form>

        </div>

      </main>

    </div>

  </div>

  <script type="module" src="profile.js"></script>

</body>
</html>
