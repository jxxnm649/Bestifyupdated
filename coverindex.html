<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover - Find it. Order it.</title>
<style>
  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
    margin: 0; 
    padding: 0; 
    background-color: #f4f6f8; 
    display: flex; 
    justify-content: center;
  }
  .app-container { 
    width: 100%; 
    max-width: 414px; 
    background: #fcfdfc; 
    min-height: 100vh; 
    position: relative; 
    display: flex;
    flex-direction: column;
    padding: 30px 20px;
    box-sizing: border-box;
  }
  .logo {
    font-size: 42px;
    font-weight: 800;
    color: #006b44;
    margin-top: 40px;
    margin-bottom: 20px;
  }
  .logo span { color: #20b273; }
  
  .hero-text h1 {
    font-size: 28px;
    color: #111;
    line-height: 1.3;
    margin: 0 0 15px 0;
  }
  .hero-text p {
    font-size: 15px;
    color: #666;
    line-height: 1.5;
    margin: 0;
  }
  
  .illustration {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px; /* Placeholder for your bag & box image */
  }
  
  .bottom-section {
    text-align: center;
    margin-top: auto;
  }
  
  .btn-primary {
    background: #006b44;
    color: white;
    border: none;
    padding: 18px;
    width: 100%;
    border-radius: 30px; /* Rounded pill shape */
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
  }
  .btn-primary:hover { background: #005636; }
  .btn-primary span { margin-left: 10px; font-size: 20px; }

  .btn-secondary {
    background: #ffffff;
    color: #006b44;
    border: 2px solid #006b44;
    padding: 16px;
    width: 100%;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    text-decoration: none;
  }

  .login-text {
    font-size: 14px;
    color: #888;
  }
  .login-text a {
    color: #006b44;
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Logo -->
  <div class="logo">Co<span>✓</span>er</div>

  <!-- Hero Text -->
  <div class="hero-text">
    <h1>Find it. Order it.<br>Get it delivered.</h1>
    <p>The easiest way to find the right product and place your order.</p>
  </div>

  <!-- Illustration Placeholder (Replace with your actual image later) -->
  <div class="illustration">
    🛍️ 📦
  </div>

  <!-- Bottom Action Buttons -->
  <div class="bottom-section">
    <a href="coverbrand.html" style="text-decoration:none;">
      <button class="btn-primary">
        Get Started <span>&rarr;</span>
      </button>
    </a>
    <a href="quick-custom-order.html" class="btn-secondary">
      📷 Quick Order — Upload Photo &amp; Order
    </a>
    <div class="login-text">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

</div>

</body>
</html>
