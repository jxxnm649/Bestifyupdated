<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>My Orders</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="orders.css">
</head>
<body>

    <div class="top-header">
        <div class="header-title-container">
            <a href="home.html" class="back-arrow" aria-label="Back">&lt;</a>
            <span class="header-title">MY ORDERS</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
            <a href="cart.html" class="help-btn" aria-label="Cart">🛒</a>
            <a href="chat.html" class="help-btn">💬 HELP</a>
        </div>
    </div>

    <div class="search-filter-wrapper">
        <div class="search-bar-container">
            <div class="search-input-box">
                <span>🔍</span>
                <input type="text" id="orderSearchInput" placeholder="Search by product name...">
            </div>
            <button type="button" class="filter-btn" id="openFilterBtn">⚙️ Filter</button>
        </div>

        <div class="filter-tabs-row" id="filterTabsRow">
            <div class="tab-chip active" data-filter="all">All Orders</div>
            <div class="tab-chip" data-filter="cod">Cash on Delivery</div>
            <div class="tab-chip" data-filter="online">Online Paid</div>
            <div class="tab-chip" data-filter="delivered">Delivered</div>
        </div>
    </div>

    <div id="orders"></div>

    <!-- Filter Drawer (Status) -->
    <div class="filter-modal-overlay" id="filterModal">
        <div class="filter-drawer">
            <div>
                <div class="filter-header">
                    <span>Filters</span>
                    <span style="cursor:pointer;" id="closeFilterBtn">&times;</span>
                </div>

                <div class="filter-group">
                    <div class="filter-title">Order Status</div>
                    <div class="filter-options" id="statusFilterOptions">
                        <button type="button" class="filter-option-btn selected" data-value="All">All</button>
                        <button type="button" class="filter-option-btn" data-value="Pending">Pending</button>
                        <button type="button" class="filter-option-btn" data-value="Shipped">Shipped</button>
                        <button type="button" class="filter-option-btn" data-value="Delivered">Delivered</button>
                        <button type="button" class="filter-option-btn" data-value="Cancelled">Cancelled</button>
                    </div>
                </div>
            </div>

            <div class="filter-actions">
                <button type="button" class="btn-reset-filter" id="resetFilterBtn">Reset</button>
                <button type="button" class="btn-apply-filter" id="applyFilterBtn">Apply Filters</button>
            </div>
        </div>
    </div>

    <!-- Real Cashback reveal modal -->
    <div class="modal-overlay" id="cashbackModal">
        <div class="scratch-card-box">
            <button type="button" class="close-modal-btn" id="closeCashbackBtn">&times;</button>
            <h4 style="font-size:15px;color:#111;">🎁 Delivery Cashback</h4>
            <p id="cashbackSubtext" style="font-size:12px;color:#666;margin-top:4px;"></p>

            <div class="scratch-area" style="height:auto;">
                <div class="coupon-reward" style="position:static;padding:16px 0;">
                    <span style="font-size:11px;color:#16a34a;font-weight:bold;" id="cashbackStatusLabel"></span>
                    <span class="coupon-code" id="cashbackAmountDisplay"></span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="orders.js"></script>

</body>
</html>
